<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="32 32 448 448">
  <defs>
<filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#022C22" flood-opacity="0.6"/>
    </filter>
    <linearGradient id="specularRim" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.40" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0.15" />
    </linearGradient>
  </defs>

  <!-- Solid Flat Squircle Base -->
  <rect x="32" y="32" width="448" height="448" rx="104" fill="#059669" />

  <!-- Calibrated Glyph (~19% Optical Margin Sweet-Spot) -->
  <g transform="translate(-30.72 -30.72) scale(1.12)">

<g filter="url(#shadow)">
    <!-- Geometric Neural Brain Outline (Clean crisp white) -->
    <!-- Left Hemisphere -->
    <path d="M 246, 170 C 200, 165 160, 200 160, 250 C 160, 285 185, 315 215, 325 C 220, 345 235, 355 246, 355 Z"
          fill="#FFFFFF" fill-opacity="0.95"/>
    <!-- Right Hemisphere -->
    <path d="M 266, 170 C 312, 165 352, 200 352, 250 C 352, 285 327, 315 297, 325 C 292, 345 277, 355 266, 355 Z"
          fill="#FFFFFF"/>

    <!-- Brain Fissure Cutout -->
    <line x1="256" y1="160" x2="256" y2="365" stroke="#059669" stroke-width="8" stroke-linecap="round"/>

    <!-- Memory Circuit Interconnects -->
    <circle cx="210" cy="225" r="7" fill="#047857"/>
    <circle cx="302" cy="225" r="7" fill="#047857"/>
    <circle cx="195" cy="280" r="7" fill="#047857"/>
    <circle cx="317" cy="280" r="7" fill="#047857"/>

    <line x1="210" y1="225" x2="246" y2="245" stroke="#047857" stroke-width="3" stroke-linecap="round"/>
    <line x1="302" y1="225" x2="266" y2="245" stroke="#047857" stroke-width="3" stroke-linecap="round"/>
    <line x1="195" y1="280" x2="246" y2="275" stroke="#047857" stroke-width="3" stroke-linecap="round"/>
    <line x1="317" y1="280" x2="266" y2="275" stroke="#047857" stroke-width="3" stroke-linecap="round"/>
  </g>
  </g>

  <!-- 2px Specular Rim Stroke -->
  <rect x="33" y="33" width="446" height="446" rx="103" fill="none" stroke="url(#specularRim)" stroke-width="2" />
</svg>